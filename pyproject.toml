[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enpo-meridianin-optimization"
version = "0.1.0"
description = "EnPO + baselines with synthetic benchmark for reaction yield/purity optimization"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Your Name"}]
dependencies = [
  "numpy>=1.23",
  "pandas>=2.0",
  "matplotlib>=3.7"
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
